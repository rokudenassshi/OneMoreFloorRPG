<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneMoreFloorRPG</title>
  <link rel="stylesheet" href="css/style.css">
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1047750481134162"
    crossorigin="anonymous"></script>
</head>
<body>
  <div class="game">
    <div class="status">
      <div class="header-row">
        <div>Lv：<span id="playerLevel"></span></div>
        <div>階層：<span id="floor"></span></div>
      </div>

      <div class="header-row">
        <div>HP：<span id="playerHp"></span></div> 
        <div><span id="enemyName"></span></div>
      </div>
      <div class="header-row">
        <div>&nbsp;</div>
        <div><span id="enemyHp">---</span></div>
      </div>
    </div>

    <div class="log" id="log"></div>

    <!-- 探索 -->
    <div id="exploreButtons">
      <div class="row">
        <button onclick="move(1)">すすむ</button>
        <button onclick="openInventory()">アイテム</button>
      </div>
      <div class="row">
        <button onclick="move(-1)">もどる</button>
        <button onclick="openStatus()">ステータス</button>
      </div>
    </div>

    <!-- 戦闘 -->
    <div id="battleButtons" style="display:none;">
      <div class="row">
        <button onclick="attack()">たたかう</button>
        <button onclick="useHerbInBattle()">やくそう</button>
      </div>
      <div class="row">
        <button class="escape-btn" onclick="escape()">にげる</button>
        <button onclick="openStatus()">ステータス</button>
      </div>
  </div>
    
  <!-- アイテム画面 -->
  <div id="inventory" style="display:none;">
    <div class="screen-header">
      <h3>アイテム</h3>
              <div class="screen-header-actions">
        <button class="discard-button" onclick="discardWeakerEquipment()">弱い装備を捨てる</button>
        <button class="back-button" onclick="closeInventory()">戻る</button>
      </div></div>
    <div id="itemList"></div>
  </div>

  <!-- ステータス画面 -->
  <div id="statusScreen" style="display:none;">
    <div class="screen-header">
      <h3>ステータス <span id="statusVersion" class="status-version"></span></h3>
      <button class="back-button" onclick="closeStatus()">戻る</button>
    </div>
    <div id="statusContent"></div>
  </div>

  <footer class="site-footer">
    <a href="index.html">トップへ戻る</a>
    <a href="privacy.html">プライバシーポリシー</a>
  </footer>

  <!-- =====================
       JavaScript 読み込み
  ===================== -->
  <!-- エントリーポイント -->
  <script src="js/core/version.js?v=1.1.2"></script>
  <script src="js/core/loader.js?v=1.1.2"></script>
</body>
</html>
