<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>OneMoreFloorRPG</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="game">
    <div class="status">
      <div class="header-row">
        <div>Lv：<span id="playerLevel"></span></div>
        <div>階層：<span id="floor"></span></div>
      </div>

      <div class="header-row">
        <div>HP：<span id="playerHp"></span></div> 
        <div><span id="enemyName"></span></div>
      </div>
      <div class="header-row">
        <div>&nbsp;</div>
        <div><span id="enemyHp">---</span></div>
      </div>
    </div>

    <div class="log" id="log"></div>

  <div id="rareEnemyPopup" class="rare-popup" aria-live="assertive" aria-hidden="true">
      <div class="rare-popup-content" role="alert">
        <div class="rare-popup-title">レアモンスター出現！</div>
        <div class="rare-popup-name" id="rareEnemyPopupName"></div>
        <div class="rare-popup-hint">タップで閉じる</div>
      </div>
    </div>

    <!-- 探索 -->
    <div id="exploreButtons">
      <div class="row">
        <button onclick="move(1)">すすむ</button>
        <button onclick="openInventory()">アイテム</button>
      </div>
      <div class="row">
        <button onclick="move(-1)">もどる</button>
        <button onclick="openStatus()">ステータス</button>
      </div>
    </div>

    <!-- 戦闘 -->
    <div id="battleButtons" style="display:none;">
      <div class="row">
        <button onclick="attack()">たたかう</button>
        <button onclick="useHerbInBattle()">やくそう</button>
      </div>
      <div class="row">
        <button class="escape-btn" onclick="escape()">にげる</button>
        <button onclick="openStatus()">ステータス</button>
      </div>
  </div>
    
  <!-- アイテム画面 -->
  <div id="inventory" style="display:none;">
    <div class="screen-header">
      <h3>アイテム</h3>
              <div class="screen-header-actions">
                <button class="discard-button" onclick="openDiscardWeakScreen()">アイテムフィルター</button><button class="back-button" onclick="closeInventory()">戻る</button>
      </div></div>
    <div id="itemList"></div>
  </div>

 <!-- アイテムフィルター設定画面 -->
  <div id="discardWeakScreen" style="display:none;">
    <div class="screen-header">
      <h3>アイテムフィルター設定</h3>
      <button class="back-button" onclick="closeDiscardWeakScreen()">戻る</button>
    </div>
    <div class="discard-weak-form">
      <p class="discard-weak-note">入力した数値以下の装備は拾いません</p>
      <div class="discard-weak-row">
        <label for="discardPowerInput">ちから</label>
        <input id="discardPowerInput" type="number" min="0" step="1">
      </div>
      <div class="discard-weak-row">
        <label for="discardVitalityInput">たいりょく</label>
        <input id="discardVitalityInput" type="number" min="0" step="1">
      </div>
      <div class="discard-weak-row">
        <label for="discardAgilityInput">すばやさ</label>
        <input id="discardAgilityInput" type="number" min="0" step="1">
      </div>
      <div class="row">
                <button class="discard-button" onclick="discardWeakerEquipment()">設定を保存</button>
      </div>
    </div>
  </div>

  <!-- ステータス画面 -->
  <div id="statusScreen" style="display:none;">
    <div class="screen-header">
      <h3>ステータス <span id="statusVersion" class="status-version"></span></h3>
      <button class="back-button" onclick="closeStatus()">戻る</button>
    </div>
    <div id="statusContent"></div>
  </div>

<!-- スキル割り振り画面 -->
  <div id="skillScreen" style="display:none;">
    <div class="screen-header">
      <h3>スキル割り振り</h3>
      <button class="back-button" onclick="closeSkillAllocation()">戻る</button>
    </div>
    <div id="skillScreenContent"></div>
  </div>
  
  <footer class="site-footer">
    <a href="index.html">トップへ戻る</a>
    <a href="privacy.html">プライバシーポリシー</a>
  </footer>

  <!-- =====================
       JavaScript 読み込み
  ===================== -->
  <!-- エントリーポイント -->
  <script src="js/core/version.js?v=1.0.10"></script>
  <script src="js/core/loader.js?v=1.0.10"></script>
  <script>
    const REQUIRED_PASSWORD = "rokudemonai";
    const enteredPassword = window.prompt("パスワードを入力してください");

    if (enteredPassword !== REQUIRED_PASSWORD) {
      window.alert("パスワードが違います。トップへ戻ります。");
      window.location.href = "index.html";
    } else {
      const appendScript = (src) =>
        new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.async = false;
          script.onload = resolve;
          script.onerror = () =>
            reject(new Error(`スクリプトの読み込みに失敗しました: ${src}`));
          document.body.appendChild(script);
        });

      appendScript("js/core/version.js?v=1.0.2")
        .then(() => appendScript("js/core/loader.js?v=1.0.2"))
        .catch((error) => {
          console.error(error);
          window.alert("初期化に失敗しました。再読み込みしてください。");
        });
    }
  </script>
</body>
</html>
